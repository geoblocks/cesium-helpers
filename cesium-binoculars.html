<!DOCTYPE html>
<html lang="en" class="wa-theme-default wa-palette-default wa-light">

<head>

  <script type="module" crossorigin src="./assets/cesium-binoculars-BsCSey19.js"></script>

  <link rel="modulepreload" crossorigin href="./assets/directive-BSZPiF1A.js">

  <link rel="modulepreload" crossorigin href="./assets/cesium-shim-deYMRcZt.js">
  <link rel="modulepreload" crossorigin href="./assets/directive-helpers-B0KETb9i.js">

<body>
  <div id="cesiumContainer"></div>

  <div id="magnification"></div>

</html>
