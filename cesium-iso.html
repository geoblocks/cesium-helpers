<!DOCTYPE html>
<html lang="en" class="wa-theme-default wa-palette-default wa-light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>html,body,#cesiumContainer{height:100%;margin:0}#cesiumContainer{touch-action:none}#controls{--spacing:var(--wa-space-s);max-inline-size:32ch;position:absolute;inset-block-start:var(--wa-space-xl);inset-inline-end:var(--wa-space-xl)}#controls .row{gap:var(--wa-space-2xs);margin-block:var(--wa-space-s);display:flex}</style>
  <script type="module" crossorigin src="./assets/cesium-iso-Dd2zZXgP.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="./assets/lit-D8AhzmO2.js">
  <link rel="modulepreload" crossorigin href="./assets/directive-BSZPiF1A.js">
  <link rel="modulepreload" crossorigin href="./assets/card-vYdPa2Ii.js">
  <link rel="modulepreload" crossorigin href="./assets/setup-COOW6wa2.js">
  <link rel="modulepreload" crossorigin href="./assets/cesium-shim-BYdCjNyS.js">
  <link rel="modulepreload" crossorigin href="./assets/directive-helpers-BBsG2Hxb.js">
  <link rel="modulepreload" crossorigin href="./assets/switch-CL249emi.js">
  <link rel="modulepreload" crossorigin href="./assets/EyeFromDepth-DmDC5MHh.js">
  <link rel="modulepreload" crossorigin href="./assets/focus-QZ153sba.js">
  <link rel="modulepreload" crossorigin href="./assets/tilt-shift-v7gihERZ.js">
  <link rel="modulepreload" crossorigin href="./assets/chunk.GWSUX3V5-BJ2wQfMz.js">
  <link rel="modulepreload" crossorigin href="./assets/chunk.UEBQI7VV-Cljs3Nge.js">
  <link rel="modulepreload" crossorigin href="./assets/chunk.JAAVYFGY-BzZoRSSO.js">
  <link rel="modulepreload" crossorigin href="./assets/option-BVj5bZ30.js">
  <link rel="modulepreload" crossorigin href="./assets/button-pDufkfty.js">
  <link rel="stylesheet" crossorigin href="./assets/flyover-studio-DfFS4Dmy.css">
</head>

<body>
  <div id="cesiumContainer"></div>
  <wa-card id="controls">
    <p class="wa-caption-m">Drag to turn, right drag or one finger to slide, wheel or pinch to zoom, two fingers to twist. Q and E turn a quarter, WASD or the arrows slide, a double click glides to the spot.</p>
    <wa-switch id="activate" size="s" checked>Isometric view</wa-switch>
    <div class="row">
      <wa-button id="left" size="s" appearance="outlined">↺ Q</wa-button>
      <wa-button id="right" size="s" appearance="outlined">E ↻</wa-button>
      <wa-button id="out" size="s" appearance="outlined">−</wa-button>
      <wa-button id="in" size="s" appearance="outlined">+</wa-button>
    </div>
    <wa-select id="style" size="s" label="Style" value="toy">
      <wa-option value="toy">Toy</wa-option>
      <wa-option value="white">White model</wa-option>
      <wa-option value="none">None</wa-option>
    </wa-select>
    <wa-switch id="tilt-shift" size="s" checked>Tilt-shift</wa-switch>
  </wa-card>
</body>

</html>
