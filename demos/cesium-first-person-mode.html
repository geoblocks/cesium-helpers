<!DOCTYPE html>
<html lang="en" class="wa-theme-default wa-palette-default wa-light">

<head>
  <meta charset="UTF-8">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      height: 100%;
      margin: 0;
    }
    #controls {
      position: absolute;
      inset-block-start: var(--wa-space-xl);
      inset-inline-end: var(--wa-space-xl);
      --spacing: var(--wa-space-s);
      max-inline-size: 30ch;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <wa-card id="controls">
    <p class="wa-caption-m">Click the button, then move the mouse to look around and use the wheel to zoom. Press Esc to leave.</p>
    <wa-button id="activate" size="s" variant="brand">
      <wa-icon slot="start" name="person-walking"></wa-icon>
      First person mode
    </wa-button>
  </wa-card>
  <script type="module">
    import {createViewer} from './setup.js';
    import FirstPersonCameraMode from '../packages/FirstPersonCameraMode/FirstPersonCameraMode.js';
    import '@awesome.me/webawesome/dist/styles/webawesome.css';
    import '@awesome.me/webawesome/dist/components/button/button.js';
    import '@awesome.me/webawesome/dist/components/card/card.js';
    import '@awesome.me/webawesome/dist/components/icon/icon.js';

    createViewer('cesiumContainer').then(viewer => {
      const mode = new FirstPersonCameraMode(viewer);
      document.querySelector('#activate').addEventListener('click', () => mode.active = true);
    });
  </script>
</body>

</html>
