<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      height: 100%;
      margin: 0;
    }
    #activate {
      position: absolute;
      right: 30px;
      top: 30px;
      font-family: monospace;
      font-weight: bold;
      font-size: 1.6em;
    }
    #reticle {
      position: absolute;
      right: 30px;
      top: 80px;
      font-family: monospace;
      color: #bbb;
    }
    /* in the notch below where the two eyepieces meet: the 160x100 eyepieces box
       fits the window, and the notch is 45% of its height below the centre */
    #magnification {
      position: absolute;
      top: calc(50% + min(45vh, 28.1vw));
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: monospace;
      font-size: 1.4em;
      color: #bbb;
      white-space: pre;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <button id="activate" type="button">toggle mode</button>
  <div id="magnification"></div>
  <label id="reticle"><input type="checkbox"> reticle</label>
  <script type="module">
    import {createViewer} from './setup.js';
    import CesiumBinoculars from '../packages/cesium-binoculars/cesium-binoculars.js';

    createViewer('cesiumContainer').then(viewer => {
      // today at 14:00, for the light
      const afternoon = new Date();
      afternoon.setHours(14, 0, 0, 0);
      viewer.clock.currentTime = Cesium.JulianDate.fromDate(afternoon);
      viewer.clock.shouldAnimate = false;

      const mode = new CesiumBinoculars(viewer);
      document.querySelector('#activate').addEventListener('click', () => mode.active = !mode.active);
      const reticle = document.querySelector('#reticle input');
      reticle.addEventListener('change', () => mode.reticle = reticle.checked);
      const magnification = document.querySelector('#magnification');
      viewer.scene.postRender.addEventListener(() => {
        const distance = mode.reticle ? mode.distance : undefined;
        const range = distance === undefined ? '' : `  ${Math.round(distance)} m`;
        const text = mode.active ? `${mode.magnification.toFixed(1)}x${range}` : '';
        if (magnification.textContent !== text) {
          magnification.textContent = text;
        }
      });
    });
  </script>
</body>

</html>
