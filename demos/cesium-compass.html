<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      height: 100%;
      margin: 0;
    }

    cesium-compass {
      position: absolute;
      right: 30px;
      top: 30px;
    }

  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <cesium-compass></cesium-compass>
  <script type="module">
    import {createViewer} from './setup.js';
    import '../packages/cesium-compass/cesium-compass.js';

    createViewer('cesiumContainer').then(viewer => {
      const compass = document.querySelector('cesium-compass');
      compass.scene = viewer.scene;
      compass.clock = viewer.clock;
    });

  </script>
</body>

</html>
