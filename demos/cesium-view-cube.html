<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      height: 100%;
      margin: 0;
    }

    cesium-view-cube {
      position: absolute;
      top: 30px;
      font-family: sans-serif;
    }

    /* the cube, as by default */
    #cube {
      right: 30px;
    }

    /* the triad: the faces hidden, the axes shown, ParaView's orientation axes */
    #triad {
      right: 160px;
    }

    #triad::part(face),
    #triad::part(face-label) {
      display: none;
    }

    #triad::part(axis),
    #triad::part(axis-label) {
      display: inline;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <cesium-view-cube id="cube"></cesium-view-cube>
  <cesium-view-cube id="triad"></cesium-view-cube>
  <script type="module">
    import {createViewer} from './setup.js';
    import '../packages/cesium-view-cube/cesium-view-cube.js';

    createViewer('cesiumContainer').then(viewer => {
      for (const element of document.querySelectorAll('cesium-view-cube')) {
        element.scene = viewer.scene;
      }
    });
  </script>
</body>

</html>
